name: release

# Pushing a tag such as v1.2.3 runs GoReleaser (.goreleaser.yaml): it builds
# mimir-server for Linux, macOS and Windows on amd64 and arm64 with the
# version set from the tag, attaches the archives and their SHA-256 sums to
# a GitHub release with notes from the merged pull requests.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # GoReleaser needs the tags and history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
