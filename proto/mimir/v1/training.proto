syntax = "proto3";

package mimir.v1;

import "google/protobuf/timestamp.proto";
import "mimir/v1/model.proto";
import "mimir/v1/template.proto";

option go_package = "github.com/gsoultan/mimir-server/gen/mimir/v1;mimirv1";

// DatasetService keeps the examples models learn from.
service DatasetService {
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetDataset(GetDatasetRequest) returns (GetDatasetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateDataset stores a table of examples (CSV with a header row) or
  // registers a built-in dataset.
  rpc CreateDataset(CreateDatasetRequest) returns (CreateDatasetResponse);
  rpc DeleteDataset(DeleteDatasetRequest) returns (DeleteDatasetResponse);
  // TestQuery runs a database query and returns its columns and a few
  // rows, so the answer column can be picked before anything is saved.
  rpc TestQuery(TestQueryRequest) returns (TestQueryResponse);
  // RefreshDataset runs a dataset's query again and replaces its rows.
  rpc RefreshDataset(RefreshDatasetRequest) returns (RefreshDatasetResponse);
  // TestBucket reads a file or folder from S3-compatible storage and says
  // what is there, so the answer column can be picked before anything is
  // saved.
  rpc TestBucket(TestBucketRequest) returns (TestBucketResponse);
  // CheckDataset checks a dataset against a template, with the columns
  // matched as given, and can keep that match.
  rpc CheckDataset(CheckDatasetRequest) returns (CheckDatasetResponse);
}

message CheckDatasetRequest {
  string dataset_id = 1;
  // template_id is the template to check against; empty checks the data
  // on its own.
  string template_id = 2;
  // match maps a template column to the dataset column that holds it, for
  // columns named differently.
  map<string, string> match = 3;
  // apply keeps the match: the answer column and column kinds change to
  // the template's, for the models taught from the dataset from now on.
  bool apply = 4;
}

message CheckDatasetResponse {
  DataCheck check = 1;
  Dataset dataset = 2;
}

// TrainingService teaches new models and follows their progress.
service TrainingService {
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateJob queues a training run. The server runs queued jobs in order.
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  // CancelJob stops a queued or running job. Its progress is kept, so it
  // can be resumed.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  // ResumeJob queues a cancelled or failed job again. It picks up from the
  // last finished epoch.
  rpc ResumeJob(ResumeJobRequest) returns (ResumeJobResponse);
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  // SetRepeat changes how often a job keeps learning; 0 stops it.
  rpc SetRepeat(SetRepeatRequest) returns (SetRepeatResponse);
}

message SetRepeatRequest {
  string id = 1;
  int64 repeat_seconds = 2;
  // min_new_rows makes each pass wait for that many new rows; 0 doesn't.
  int64 min_new_rows = 3;
}

message SetRepeatResponse {
  Job job = 1;
}

// DatasetKind says where a dataset's examples come from.
enum DatasetKind {
  DATASET_KIND_UNSPECIFIED = 0;
  // TABLE is a CSV uploaded by a person: numeric columns and one label column.
  DATASET_KIND_TABLE = 1;
  // MNIST is the built-in handwritten digits set, downloaded on first use.
  DATASET_KIND_MNIST = 2;
  // PHOTOS is a ZIP of photos with one folder per answer.
  DATASET_KIND_PHOTOS = 3;
  // PHOTO_TABLE is a ZIP of a data.csv and the photos its rows name.
  DATASET_KIND_PHOTO_TABLE = 4;
  // SOUNDS is a ZIP of WAV sounds with one folder per answer.
  DATASET_KIND_SOUNDS = 5;
  // BOXES is a ZIP of photos and a table of the boxes around the things
  // in them.
  DATASET_KIND_BOXES = 6;
}

message Dataset {
  string id = 1;
  string name = 2;
  DatasetKind kind = 3;
  // Rows is how many examples the dataset holds.
  int64 rows = 4;
  // Features names each input column, in order. Empty for images.
  repeated string features = 5;
  // Labels lists the classes an example can belong to, in order.
  repeated string labels = 6;
  // InputShape is the shape of one example, as models see it.
  repeated int64 input_shape = 7;
  // Target is the label column's name for a table.
  string target = 8;
  int64 size_bytes = 9;
  google.protobuf.Timestamp create_time = 10;
  // Driver and query are set when the rows come from a database; the
  // connection itself is never returned.
  string driver = 12;
  string query = 13;
  google.protobuf.Timestamp refresh_time = 14;
  // Architectures lists the model types that can learn from this dataset.
  repeated string architectures = 11;
  // columns are the input columns and their kinds.
  repeated Column columns = 15;
  // number_target says every answer is a number.
  bool number_target = 16;
  // skipped counts rows left out: no answer, or no photo.
  int64 skipped = 17;
  // storage is set when the rows come from S3-compatible storage, so they
  // can be fetched again; the keys are never returned.
  StorageSource storage = 18;
}

// StorageSource says where in a bucket a dataset's rows come from.
message StorageSource {
  string provider = 1;
  string endpoint = 2;
  string bucket = 3;
  string path = 4;
}

message ListDatasetsRequest {}

message ListDatasetsResponse {
  repeated Dataset datasets = 1;
}

message GetDatasetRequest {
  string id = 1;
}

message GetDatasetResponse {
  Dataset dataset = 1;
  // Sample holds the first few rows, for a preview.
  repeated Row sample = 2;
}

message Row {
  repeated string values = 1;
}

message CreateDatasetRequest {
  string name = 1;
  DatasetKind kind = 2;
  // Csv is the table, with a header row, for a TABLE dataset.
  bytes csv = 3;
  // Target is the column that holds what to predict. Empty means the last
  // column.
  string target = 4;
  // Connection and query fetch the table from a database instead of csv.
  Connection connection = 5;
  string query = 6;
  // archive is the ZIP for a PHOTOS or PHOTO_TABLE dataset.
  bytes archive = 7;
  // template_id checks the data against a template and reads its columns
  // as the template says; the answer column is the template's when found.
  string template_id = 8;
  // example makes the dataset from the template's made-up example data,
  // instead of csv, archive or a query.
  bool example = 9;
  // bucket and path read the examples from S3-compatible storage instead:
  // a .csv (or a folder of them) for a table, a .zip or a folder for
  // photos.
  Bucket bucket = 10;
  string path = 11;
}

// Bucket is how to reach S3-compatible storage.
message Bucket {
  // provider is "s3" (AWS), "r2" (Cloudflare) or "other". AWS and R2 fill
  // in the endpoint.
  string provider = 1;
  // endpoint is the storage address, like https://minio.example.com, for
  // "other".
  string endpoint = 2;
  // region is the AWS region; "auto" for R2. Empty means us-east-1.
  string region = 3;
  // account_id is the Cloudflare account ID, for R2.
  string account_id = 4;
  string bucket = 5;
  string access_key_id = 6;
  // secret_access_key is kept on the server and never returned.
  string secret_access_key = 7;
}

message TestBucketRequest {
  Bucket bucket = 1;
  // path is a file, or a folder ending in a slash; empty is the whole
  // bucket.
  string path = 2;
  // kind is what the files should make: a table reads the CSVs.
  DatasetKind kind = 3;
}

message TestBucketResponse {
  // files counts the files found, and size_bytes their total size.
  int64 files = 1;
  int64 size_bytes = 2;
  // names lists the first few, relative to the folder.
  repeated string names = 3;
  // For a table: its columns, a few rows and how many rows in all.
  repeated string columns = 4;
  repeated Row sample = 5;
  int64 rows = 6;
}

// Connection is how to reach a database.
message Connection {
  // driver is "postgres", "mysql" or "sqlite".
  string driver = 1;
  // dsn is the connection string, or the file path for sqlite.
  string dsn = 2;
}

message TestQueryRequest {
  Connection connection = 1;
  string query = 2;
}

message TestQueryResponse {
  repeated string columns = 1;
  repeated Row sample = 2;
  int64 rows = 3;
}

message RefreshDatasetRequest {
  string id = 1;
}

message RefreshDatasetResponse {
  Dataset dataset = 1;
}

message CreateDatasetResponse {
  Dataset dataset = 1;
  // check says how well the data fits: always for a table or photos, and
  // against the template when one was given.
  DataCheck check = 2;
}

message DeleteDatasetRequest {
  string id = 1;
}

message DeleteDatasetResponse {}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
}

// TrainingSettings are the knobs most people leave alone.
message TrainingSettings {
  int32 epochs = 1;
  int32 batch_size = 2;
  double learning_rate = 3;
  // HoldOut is the share of examples kept aside to score the model,
  // between 0 and 0.5. Ignored for datasets with their own test split.
  double hold_out = 4;
  // layers, when set, shapes a table model in place of its usual hidden
  // layers: at most 8 steps, with at least one dense.
  repeated Layer layers = 5;
}

// Layer is one step of a designed table model.
message Layer {
  // kind is "dense" (learn patterns with units numbers) or "dropout"
  // (forget a rate of them while learning, so it doesn't memorise).
  string kind = 1;
  int32 units = 2;
  double rate = 3;
}

// EpochResult is how one pass over the examples went.
message EpochResult {
  int32 epoch = 1;
  double loss = 2;
  // Accuracy is the share of held-out examples the model got right. For a
  // number model, an answer within 10% of the real one counts as right.
  double accuracy = 3;
  double val_loss = 4;
  int64 duration_millis = 5;
  // typical_error is how far a number model's answers are off on average,
  // in the answer's units.
  double typical_error = 6;
}

message Job {
  string id = 1;
  // Name is what the finished model will be called.
  string name = 2;
  string description = 3;
  string architecture = 4;
  string dataset_id = 5;
  string dataset_name = 6;
  TrainingSettings settings = 7;
  JobStatus status = 8;
  // Error says in plain words why a failed job stopped.
  string error = 9;
  // Epoch is the last finished epoch; epochs is the goal.
  int32 epoch = 10;
  repeated EpochResult history = 11;
  // ModelId is the model a succeeded job produced.
  string model_id = 12;
  string created_by = 13;
  google.protobuf.Timestamp create_time = 14;
  google.protobuf.Timestamp start_time = 15;
  google.protobuf.Timestamp end_time = 16;
  // Accuracy is the final score, as a share from 0 to 1.
  double accuracy = 17;
  // StepsPerEpoch and step give progress within the running epoch.
  int32 steps_per_epoch = 18;
  int32 step = 19;
  // worker names the worker that ran it, or is empty for this server.
  string worker = 20;
  // repeat_seconds > 0 means the job keeps learning: every so often the
  // examples are fetched again and a new pass continues from the model.
  int64 repeat_seconds = 21;
  google.protobuf.Timestamp next_run_time = 22;
  // parent_id is the first job of a keep-learning chain, for later passes.
  string parent_id = 23;
  // base_model_id is the model a pass continued from.
  string base_model_id = 24;
  // note says what a pass did with its result, in words.
  string note = 25;
  // run_on is the worker the run was asked to train on; empty means any.
  // worker is where it actually ran.
  string run_on = 26;
  // min_new_rows > 0 makes a keep-learning pass wait until the source has
  // at least that many rows more than trained_rows, the rows this pass
  // started with. Until then it looks every repeat_seconds.
  int64 min_new_rows = 27;
  int64 trained_rows = 28;
  // check_time and check_note say when it last looked at the source
  // without starting a pass, and what it found.
  google.protobuf.Timestamp check_time = 29;
  string check_note = 30;
  // start_from_model_id is the model the run started from, if any.
  string start_from_model_id = 31;
}

message ListJobsRequest {}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message CreateJobRequest {
  string name = 1;
  string description = 2;
  string architecture = 3;
  string dataset_id = 4;
  // Settings may be left empty for sensible defaults.
  TrainingSettings settings = 5;
  // repeat_seconds asks for the job to keep learning on that interval.
  int64 repeat_seconds = 6;
  // worker_id trains the run on that worker (from
  // WorkerService.ListWorkerChoices); empty lets the console choose. The
  // model it makes runs on the same worker.
  string worker_id = 7;
  // min_new_rows makes each keep-learning pass wait for that many new rows
  // in the source; 0 starts one every repeat_seconds.
  int64 min_new_rows = 8;
  // start_from_model_id starts the run from what that model learned, a
  // model of the same architecture: it keeps the layers that read the
  // examples and learns this dataset's answers on top, as a new model.
  string start_from_model_id = 9;
}

message CreateJobResponse {
  Job job = 1;
}

message CancelJobRequest {
  string id = 1;
}

message CancelJobResponse {
  Job job = 1;
}

message ResumeJobRequest {
  string id = 1;
}

message ResumeJobResponse {
  Job job = 1;
}

message DeleteJobRequest {
  string id = 1;
}

message DeleteJobResponse {}
