syntax = "proto3";

package mimir.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gsoultan/mimir-server/gen/mimir/v1;mimirv1";

// WebhookService tells your apps when something happens. Each delivery is
// an HTTP POST with a JSON body and a "Mimir-Signature: t=<unix>,v1=<hex
// HMAC-SHA256 of "<t>.<body>">" header. Deliveries are retried for a day,
// so an event can arrive more than once; use its id to spot repeats.
service WebhookService {
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateWebhook returns the signing secret once.
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  // SendTestEvent queues a "test" event so you can check your endpoint.
  rpc SendTestEvent(SendTestEventRequest) returns (SendTestEventResponse);
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Redeliver sends a past delivery again, now.
  rpc Redeliver(RedeliverRequest) returns (RedeliverResponse);
}

message Webhook {
  string id = 1;
  string name = 2;
  string url = 3;
  // Events are the event types sent, such as "model.created". Empty means
  // every event.
  repeated string events = 4;
  bool enabled = 5;
  google.protobuf.Timestamp create_time = 6;
  // LastDelivery summarises the most recent attempt, if any.
  Delivery last_delivery = 7;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  // PENDING: not sent yet, or waiting to retry.
  DELIVERY_STATUS_PENDING = 1;
  DELIVERY_STATUS_DELIVERED = 2;
  // FAILED: gave up after a day of retries.
  DELIVERY_STATUS_FAILED = 3;
}

message Delivery {
  string id = 1;
  string webhook_id = 2;
  string event_type = 3;
  // EventId is the same across retries of one event.
  string event_id = 4;
  DeliveryStatus status = 5;
  int32 attempts = 6;
  // ResponseCode is the HTTP status of the last attempt, 0 if none.
  int32 response_code = 7;
  // Error explains the last failure in plain words.
  string error = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp last_attempt_time = 10;
  google.protobuf.Timestamp next_attempt_time = 11;
  // Payload is the JSON body that was (or will be) sent.
  string payload = 12;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
  // EventTypes lists every event a webhook can subscribe to.
  repeated string event_types = 2;
}

message CreateWebhookRequest {
  string name = 1;
  string url = 2;
  repeated string events = 3;
}

message CreateWebhookResponse {
  Webhook webhook = 1;
  // Secret signs deliveries. It's shown only once.
  string secret = 2;
}

message UpdateWebhookRequest {
  string id = 1;
  string name = 2;
  string url = 3;
  repeated string events = 4;
  bool enabled = 5;
}

message UpdateWebhookResponse {
  Webhook webhook = 1;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {}

message SendTestEventRequest {
  string id = 1;
}

message SendTestEventResponse {
  Delivery delivery = 1;
}

message ListDeliveriesRequest {
  string webhook_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;
  string next_page_token = 2;
}

message RedeliverRequest {
  string id = 1;
}

message RedeliverResponse {
  Delivery delivery = 1;
}
