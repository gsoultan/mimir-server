syntax = "proto3";

package mimir.v1;

import "google/protobuf/timestamp.proto";
import "mimir/v1/model.proto";
import "mimir/v1/training.proto";

option go_package = "github.com/gsoultan/mimir-server/gen/mimir/v1;mimirv1";

// WorkerService manages the workers that run models for this server, and
// carries the link each worker holds open.
service WorkerService {
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateWorker registers a worker and returns its token, shown once.
  rpc CreateWorker(CreateWorkerRequest) returns (CreateWorkerResponse);
  rpc DeleteWorker(DeleteWorkerRequest) returns (DeleteWorkerResponse);
  // GetWorker is one worker's dashboard: how it is doing now and over
  // time, what it runs, and how it is connected.
  rpc GetWorker(GetWorkerRequest) returns (GetWorkerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ReplaceWorkerToken makes a new token for a worker, shown once. The old
  // token stops working, the worker is disconnected, and its key is
  // forgotten so it can join again with the new token.
  rpc ReplaceWorkerToken(ReplaceWorkerTokenRequest) returns (ReplaceWorkerTokenResponse);
  // SetWorkerTasks tells a worker what to take: "all", "train" (training
  // runs only) or "serve" (predictions only). Empty leaves it to the
  // worker's own -tasks flag. It applies at once to a connected worker.
  rpc SetWorkerTasks(SetWorkerTasksRequest) returns (SetWorkerTasksResponse);
  // ListWorkerChoices lists the workers a model or training run can be
  // placed on, for anyone who can add models. It leaves out tokens,
  // addresses and who added them.
  rpc ListWorkerChoices(ListWorkerChoicesRequest) returns (ListWorkerChoicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Link is the stream a worker keeps open while it is available. The
  // worker authenticates with "Authorization: Bearer <worker token>" and
  // says hello with its public key. The server sends a challenge, the
  // worker signs it with its private key, and only then is it welcomed and
  // sent tasks. The first key a token joins with is the one it must keep
  // using.
  rpc Link(stream LinkRequest) returns (stream LinkResponse);
  // GetCloudGpu says how training runs rent a GPU when they wait, and
  // whether one is running now.
  rpc GetCloudGpu(GetCloudGpuRequest) returns (GetCloudGpuResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateCloudGpu sets it up, changes it, or turns it off. Turning it on
  // the first time adds a worker for it, which teaches only.
  rpc UpdateCloudGpu(UpdateCloudGpuRequest) returns (UpdateCloudGpuResponse);
  // StopCloudGpu stops the rented GPU now, whatever it is doing. Runs on
  // it go back in the queue to resume from their checkpoints, and start
  // it again if they still wait.
  rpc StopCloudGpu(StopCloudGpuRequest) returns (StopCloudGpuResponse);
}

// Worker is a process that runs models for this server, here or elsewhere.
message Worker {
  string id = 1;
  string name = 2;
  bool online = 3;
  google.protobuf.Timestamp last_seen = 4;
  google.protobuf.Timestamp create_time = 5;
  // What the worker reported when it connected.
  string device = 6;
  int32 cpus = 7;
  int64 memory_bytes = 8;
  repeated string architectures = 9;
  bool trains = 10;
  int32 capacity = 11;
  int32 busy = 12;
  string version = 13;
  string address = 14;
  string created_by = 15;
  // stats is the latest the worker reported, while online.
  Stats stats = 16;
  // connect_time is when the current link opened.
  google.protobuf.Timestamp connect_time = 17;
  // key_fingerprint identifies the key the worker joined with; empty
  // until it first joins.
  string key_fingerprint = 18;
  // security says how the current link is protected: "tls" when the
  // console serves TLS itself, "proxy" when a proxy in front says it does,
  // "local" for a worker on the same machine, "plain" otherwise.
  string security = 19;
  string tls_version = 20;
  // models is how many models are set to run on it.
  int32 models = 21;
  // waiting is how many runs are waiting for it.
  int32 waiting = 22;
  // training_only says the worker takes training runs and no predictions
  // (it was started with -tasks train, or tasks below says train).
  bool training_only = 23;
  // tasks is what the console tells the worker to take, set from its
  // page: "all", "train" or "serve". Empty leaves it to the worker's own
  // -tasks flag; trains and training_only say what applies now.
  string tasks = 24;
}

// Stats is how a worker's machine is doing.
message Stats {
  // cpu_percent is how busy all its CPUs are together, 0 to 100.
  double cpu_percent = 1;
  int64 memory_used_bytes = 2;
  int64 memory_total_bytes = 3;
  // disk is the storage holding the worker's data folder.
  int64 disk_used_bytes = 4;
  int64 disk_total_bytes = 5;
  // uptime_seconds is how long the worker process has been running.
  int64 uptime_seconds = 6;
  double load_average = 7;
  // memory_pressure is how tight the worker's own memory is against its
  // budget: 0 ok, 1 high (it takes no training runs), 2 critical (it is
  // also loading no more models). A worker sends a heartbeat at once
  // when it changes.
  int32 memory_pressure = 8;
  // memory_budget_bytes is the most memory the worker lets itself use.
  int64 memory_budget_bytes = 9;
}

// WorkerSample is a worker's stats at one moment, for charts.
message WorkerSample {
  google.protobuf.Timestamp time = 1;
  double cpu_percent = 2;
  int64 memory_used_bytes = 3;
  int64 memory_total_bytes = 4;
  int64 disk_used_bytes = 5;
  int64 disk_total_bytes = 6;
  int32 busy = 7;
  int32 capacity = 8;
}

// WorkerTask is something a worker is doing now.
message WorkerTask {
  // kind is "predict" or "train".
  string kind = 1;
  string model_id = 2;
  string model_name = 3;
  string job_id = 4;
  string job_name = 5;
  google.protobuf.Timestamp start_time = 6;
  // count is how many of the same are running, for predictions.
  int32 count = 7;
}

// WorkerItem is a model, run or event that belongs to a worker.
message WorkerItem {
  string id = 1;
  string name = 2;
  string status = 3;
  google.protobuf.Timestamp time = 4;
}

message GetWorkerRequest {
  string id = 1;
  // hours of history to chart: 1, 24 or 168. Defaults to 1.
  int32 hours = 2;
}

message GetWorkerResponse {
  Worker worker = 1;
  repeated WorkerSample samples = 2;
  repeated WorkerTask tasks = 3;
  // models are the models set to run on it.
  repeated WorkerItem models = 4;
  // runs are recent and waiting training runs on it, newest first.
  repeated WorkerItem runs = 5;
  // events are recent connection events from the audit log.
  repeated WorkerItem events = 6;
}

message ReplaceWorkerTokenRequest {
  string id = 1;
}

message ReplaceWorkerTokenResponse {
  string token = 1;
}

message SetWorkerTasksRequest {
  string id = 1;
  string tasks = 2;
}

message SetWorkerTasksResponse {
  Worker worker = 1;
}

message ListWorkerChoicesRequest {}

message ListWorkerChoicesResponse {
  repeated Worker workers = 1;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated Worker workers = 1;
  // secure_join says new tokens carry the console's certificate
  // fingerprint, so workers check they reach this console.
  bool secure_join = 2;
}

message CreateWorkerRequest {
  string name = 1;
}

message CreateWorkerResponse {
  Worker worker = 1;
  // token is the secret the worker connects with. It is not stored and
  // cannot be shown again.
  string token = 2;
}

message DeleteWorkerRequest {
  string id = 1;
}

message DeleteWorkerResponse {}

// LinkRequest is what a worker sends on its link.
message LinkRequest {
  oneof body {
    Hello hello = 1;
    PredictResult predict_result = 2;
    TrainProgress train_progress = 3;
    TrainResult train_result = 4;
    Heartbeat heartbeat = 5;
    Proof proof = 6;
    LoadResult load_result = 7;
    GroupShare group_share = 8;
  }
}

// LinkResponse is what the server sends down a link.
message LinkResponse {
  oneof body {
    Welcome welcome = 1;
    PredictTask predict = 2;
    TrainTask train = 3;
    CancelTask cancel = 4;
    Challenge challenge = 5;
    LoadTask load = 6;
    GroupMean group_mean = 7;
    ForgetModel forget = 8;
  }
}

// LoadTask hands a worker a model's weights ahead of any prediction, so
// the first one after a run finishes is as quick as the rest. The
// worker keeps answering with the version it has until this one is
// loaded.
message LoadTask {
  string task_id = 1;
  string model_id = 2;
  string architecture = 3;
  ModelSpec spec = 4;
  bytes weights = 5;
}

message LoadResult {
  string task_id = 1;
  // error says why the model couldn't be loaded; empty means it is.
  string error = 2;
}

// ForgetModel tells a worker a model it was sent is gone (deleted, or
// moved to another worker), so it lets go of the weights now rather than
// keep them until its cache fills. It needs no reply.
message ForgetModel {
  string model_id = 1;
}

// Challenge asks the worker to prove it holds its key.
message Challenge {
  bytes nonce = 1;
}

// Proof is the worker's Ed25519 signature of "mimir-worker-link-v1\n"
// followed by the challenge's nonce.
message Proof {
  bytes signature = 1;
}

// Hello is the first message on a link: what the worker can do.
message Hello {
  string device = 1;
  int32 cpus = 2;
  int64 memory_bytes = 3;
  // architectures the worker can run predictions for.
  repeated string architectures = 4;
  // trains says the worker can also train those architectures.
  bool trains = 5;
  // capacity is how many tasks the worker takes at once.
  int32 capacity = 6;
  string version = 7;
  // public_key is the worker's Ed25519 public key.
  bytes public_key = 8;
  Stats stats = 9;
  // training_only says the worker trains the architectures and does not
  // answer predictions for them, so the console sends it no predictions.
  bool training_only = 10;
  // group_architectures are those the worker can train together with
  // other workers, one run split between them (see TrainTask.group_size).
  repeated string group_architectures = 11;
}

// Heartbeat keeps the link alive and carries fresh stats.
message Heartbeat {
  Stats stats = 1;
}

message Welcome {
  string worker_id = 1;
  string name = 2;
  // tasks is what the console wants the worker to take ("all", "train"
  // or "serve"); empty keeps the worker's own -tasks.
  string tasks = 3;
}

// ModelSpec is what a model reads and answers.
message ModelSpec {
  repeated int64 input_shape = 1;
  repeated string labels = 2;
  repeated string features = 3;
  repeated Column columns = 4;
}

// PredictTask asks for one prediction. weights travel only the first time
// a link sees a model; the worker keeps them.
message PredictTask {
  string task_id = 1;
  string model_id = 2;
  string architecture = 3;
  ModelSpec spec = 4;
  bytes weights = 5;
  Tensor input = 6;
}

message PredictResult {
  string task_id = 1;
  Tensor output = 2;
  Tensor probabilities = 3;
  string error = 4;
  // need_weights asks the server to send the task again with the weights.
  bool need_weights = 5;
}

// TrainTask asks the worker to train a model from the examples it carries.
message TrainTask {
  string task_id = 1;
  string job_id = 2;
  string architecture = 3;
  TrainingSettings settings = 4;
  DatasetKind dataset_kind = 5;
  // csv holds the table for DATASET_KIND_TABLE, with target naming the
  // answer column.
  bytes csv = 6;
  string target = 7;
  // history is what earlier attempts already finished, for a resumed job.
  repeated EpochResult history = 8;
  // base_weights, when set, are a model to continue training from.
  bytes base_weights = 9;
  // base_labels and base_features are what the base model answers and
  // reads; its weights carry over only while they still match.
  repeated string base_labels = 10;
  repeated string base_features = 11;
  // archive holds the ZIP for DATASET_KIND_PHOTOS and PHOTO_TABLE.
  bytes archive = 12;
  // columns are the dataset's columns as first read; their kinds are kept.
  repeated Column columns = 13;
  // group_size above 1 says this worker trains the run together with
  // group_size - 1 others, as member group_rank (from 0). Each learns from
  // its share of the batches, and they average their weights through the
  // console with GroupShare. Member 0 reports progress and sends back the
  // weights; the others send an empty result.
  int32 group_rank = 14;
  int32 group_size = 15;
}

// GroupShare is one member's weights for a group's next average. round
// counts from 0 and every member sends each round once.
message GroupShare {
  string task_id = 1;
  int64 round = 2;
  repeated float values = 3;
  // weight is how much these values count in the mean.
  double weight = 4;
}

// GroupMean is the mean of a round's GroupShares, sent to every member.
message GroupMean {
  string task_id = 1;
  int64 round = 2;
  repeated float values = 3;
}

message TrainProgress {
  string task_id = 1;
  int32 epoch = 2;
  int32 step = 3;
  int32 steps_per_epoch = 4;
  repeated EpochResult history = 5;
}

message TrainResult {
  string task_id = 1;
  bytes weights = 2;
  repeated EpochResult history = 3;
  ModelSpec spec = 4;
  string error = 5;
  bool cancelled = 6;
  // fresh says the base weights didn't fit and it learned from scratch.
  bool fresh = 7;
  // low_memory says the worker stopped, or wouldn't start, the run to
  // stay within its memory. The run goes back in the queue and resumes
  // from its checkpoint.
  bool low_memory = 8;
  // report is how the model did on the examples kept aside, as the JSON
  // of the console's run report; empty when it wasn't scored.
  bytes report = 9;
}

message CancelTask {
  string task_id = 1;
}

// CloudGpu is a GPU rented by the minute for training, from Modal, AWS
// EC2, Google Cloud, RunPod, Lambda Cloud or Vast.ai. When a training run
// waits that no other worker can take, the console starts a machine with
// that GPU running this server as a worker that teaches only. It stops
// once it has had nothing to do for idle_minutes, and the console removes
// the machine, so it is paid for only while it trains.
message CloudGpu {
  bool enabled = 1;
  // provider is "modal", "aws", "gcp", "runpod", "lambda" or "vast".
  string provider = 15;
  // token_id is the credential's public part: the Modal token id (ak-...)
  // or the AWS access key id. The secret part (the Modal token secret, AWS
  // secret key, Google service account JSON key, or RunPod, Lambda or
  // Vast.ai API key) is never shown; has_token_secret says one is stored.
  string token_id = 2;
  bool has_token_secret = 3;
  // gpu is what the provider calls the machine, one of the provider's
  // CloudGpuProvider.gpus.
  string gpu = 4;
  // region is the AWS or Lambda Cloud region, or the Google Cloud zone.
  string region = 16;
  // ssh_key names the SSH key Lambda Cloud requires on every instance.
  string ssh_key = 17;
  // console_url is the https address the GPU machine reaches this console
  // at, such as https://mimir.example.com.
  string console_url = 5;
  // idle_minutes is how long it waits for more work before it stops.
  int32 idle_minutes = 6;
  // max_hours is the longest one machine runs. A run still going then
  // goes back in the queue and resumes on a fresh one.
  int32 max_hours = 7;
  // capacity is how many runs it trains at once.
  int32 capacity = 8;
  // program_url, when set, is where the machine downloads mimir-server
  // for linux/amd64 from. Empty takes it from this console, which works
  // when the console itself runs on linux/amd64 (can_serve_program).
  string program_url = 9;
  bool can_serve_program = 10;
  // worker_id is the worker the rented GPU joins as.
  string worker_id = 11;
  // state is "off", "asleep" (nothing waiting), "starting", "running" or
  // "failed"; state_time is when it got there and error says why it
  // failed.
  string state = 12;
  google.protobuf.Timestamp state_time = 13;
  string error = 14;
}

message GetCloudGpuRequest {}

message GetCloudGpuResponse {
  CloudGpu cloud_gpu = 1;
  // providers are where a GPU can be rented, with what each offers.
  repeated CloudGpuProvider providers = 2;
}

// CloudGpuProvider is a place that rents GPUs.
message CloudGpuProvider {
  string id = 1;
  string name = 2;
  // gpus are the machines offered, cheapest first, labelled with their
  // memory and about what an hour costs.
  repeated CloudGpuChoice gpus = 3;
  string default_gpu = 4;
  // regions are suggested where the provider asks for a region or zone.
  repeated string regions = 5;
  string default_region = 6;
}

message CloudGpuChoice {
  string id = 1;
  string label = 2;
}

message UpdateCloudGpuRequest {
  bool enabled = 1;
  string provider = 10;
  string token_id = 2;
  // token_secret replaces the stored one; empty keeps it, unless the
  // provider changes.
  string token_secret = 3;
  string gpu = 4;
  string region = 11;
  string ssh_key = 12;
  string console_url = 5;
  int32 idle_minutes = 6;
  int32 max_hours = 7;
  int32 capacity = 8;
  string program_url = 9;
}

message UpdateCloudGpuResponse {
  CloudGpu cloud_gpu = 1;
}

message StopCloudGpuRequest {}

message StopCloudGpuResponse {
  CloudGpu cloud_gpu = 1;
}
