syntax = "proto3";

package mimir.v1;

import "google/protobuf/timestamp.proto";
import "mimir/v1/training.proto";

option go_package = "github.com/gsoultan/mimir-server/gen/mimir/v1;mimirv1";

// ScoringService answers every row of a table at once: a file, a
// database query, files in storage or a dataset. Each run writes a CSV
// of the rows with the model's answers next to them, which
// GET /api/scorings/{id}/results downloads. A scoring can run again on a
// schedule, fetching its rows afresh each time.
service ScoringService {
  rpc ListScorings(ListScoringsRequest) returns (ListScoringsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetScoring returns a scoring with the first rows of its results.
  rpc GetScoring(GetScoringRequest) returns (GetScoringResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateScoring queues a scoring. The server runs queued scorings in
  // order, a few at a time.
  rpc CreateScoring(CreateScoringRequest) returns (CreateScoringResponse);
  // RunScoring queues a finished, failed or cancelled scoring again now,
  // fetching its rows afresh.
  rpc RunScoring(RunScoringRequest) returns (RunScoringResponse);
  // CancelScoring stops a queued or running scoring. Results already
  // written are dropped.
  rpc CancelScoring(CancelScoringRequest) returns (CancelScoringResponse);
  // SetScoringRepeat changes how often a scoring runs again; 0 stops it.
  rpc SetScoringRepeat(SetScoringRepeatRequest) returns (SetScoringRepeatResponse);
  rpc DeleteScoring(DeleteScoringRequest) returns (DeleteScoringResponse);
}

message Scoring {
  string id = 1;
  string name = 2;
  string model_id = 3;
  string model_name = 4;
  // source is where the rows come from: "upload", "database", "storage"
  // or "dataset". source_detail says which, in words; a connection or a
  // storage key is never returned.
  string source = 5;
  string source_detail = 6;
  string dataset_id = 7;
  JobStatus status = 8;
  // error says in plain words why a failed scoring stopped.
  string error = 9;
  // rows is how many rows the last run read; done how many it has
  // answered so far, and failed how many of those it couldn't answer
  // (their "problem" column says why).
  int64 rows = 10;
  int64 done = 11;
  int64 failed = 12;
  // columns are the result's columns: the rows' own, then the answer's.
  repeated string columns = 13;
  int64 result_bytes = 14;
  string created_by = 15;
  google.protobuf.Timestamp create_time = 16;
  google.protobuf.Timestamp start_time = 17;
  google.protobuf.Timestamp end_time = 18;
  // repeat_seconds > 0 runs it again that often; next_run_time is when.
  int64 repeat_seconds = 19;
  google.protobuf.Timestamp next_run_time = 20;
  // runs counts the runs that finished.
  int32 runs = 21;
  // model_version_id is the version of the model the last run answered
  // with.
  string model_version_id = 22;
}

message ListScoringsRequest {
  // model_id, when set, lists only that model's scorings.
  string model_id = 1;
}

message ListScoringsResponse {
  repeated Scoring scorings = 1;
}

message GetScoringRequest {
  string id = 1;
}

message GetScoringResponse {
  Scoring scoring = 1;
  // sample is the first rows of the results, in columns' order.
  repeated Row sample = 2;
}

message CreateScoringRequest {
  // name is what to call it; empty names it after the model and source.
  string name = 1;
  // model_id is a model that reads table rows.
  string model_id = 2;
  // One source: csv is a table with a header row; connection and query
  // fetch it from a database; bucket and path read it from S3-compatible
  // storage (a .csv or a folder of them); dataset_id scores a table
  // dataset's rows. A database or storage needs an admin.
  bytes csv = 3;
  Connection connection = 4;
  string query = 5;
  Bucket bucket = 6;
  string path = 7;
  string dataset_id = 8;
  // repeat_seconds runs it again that often, from an hour to 30 days;
  // only for a database or storage, whose rows change.
  int64 repeat_seconds = 9;
}

message CreateScoringResponse {
  Scoring scoring = 1;
}

message RunScoringRequest {
  string id = 1;
}

message RunScoringResponse {
  Scoring scoring = 1;
}

message CancelScoringRequest {
  string id = 1;
}

message CancelScoringResponse {
  Scoring scoring = 1;
}

message SetScoringRepeatRequest {
  string id = 1;
  int64 repeat_seconds = 2;
}

message SetScoringRepeatResponse {
  Scoring scoring = 1;
}

message DeleteScoringRequest {
  string id = 1;
}

message DeleteScoringResponse {}
