syntax = "proto3";

package mimir.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gsoultan/mimir-server/gen/mimir/v1;mimirv1";

// ModelService manages the models the server can run.
service ModelService {
  // ListArchitectures returns the model architectures this server can build.
  rpc ListArchitectures(ListArchitecturesRequest) returns (ListArchitecturesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListModels returns every model, newest first.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetModel returns one model.
  rpc GetModel(GetModelRequest) returns (GetModelResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateModel stores weights for a known architecture and makes the model
  // ready to answer.
  rpc CreateModel(CreateModelRequest) returns (CreateModelResponse);
  // UpdateModel renames a model or changes its description.
  rpc UpdateModel(UpdateModelRequest) returns (UpdateModelResponse);
  // DeleteModel removes a model and its weights.
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);
  // SetModelWorker picks the worker that answers a model's questions, or
  // none to let the console choose.
  rpc SetModelWorker(SetModelWorkerRequest) returns (SetModelWorkerResponse);
}

message SetModelWorkerRequest {
  string id = 1;
  // worker_id is a worker from WorkerService.ListWorkerChoices, or empty
  // for automatic.
  string worker_id = 2;
}

message SetModelWorkerResponse {
  Model model = 1;
}

// PredictService asks models questions.
service PredictService {
  // Predict runs one input through a model.
  rpc Predict(PredictRequest) returns (PredictResponse);
  // Generate continues a prompt with a language model, such as one
  // uploaded as a GGUF file.
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  // GenerateStream is Generate, sending the text as the model writes it.
  rpc GenerateStream(GenerateStreamRequest) returns (stream GenerateStreamResponse);
  // Chat writes a language model's next turn in a chat, sending the text
  // as the model writes it.
  rpc Chat(ChatRequest) returns (stream ChatResponse);
}

// Architecture is a model shape the server knows how to build.
message Architecture {
  // Name identifies the architecture, for example "mnist-cnn".
  string name = 1;
  // Title is a short human name.
  string title = 2;
  // Description says in plain words what models of this shape do.
  string description = 3;
  // InputShape is the shape of one input, without the batch dimension.
  repeated int64 input_shape = 4;
  // Labels names each output class, in order. Empty when the labels come
  // from the dataset a model is taught with.
  repeated string labels = 5;
  // Trainable says the server can teach models of this shape.
  bool trainable = 6;
  // Input says what the model reads: "image" for pictures, "table" for a
  // row of a table, "photo_table" for a photo with a row of details,
  // "tensor" for raw numbers and "text" for a prompt.
  string input = 7;
  // Output says what the model answers: "class" picks a label, "number"
  // answers with a number and "text" writes text (see Generate).
  string output = 8;
}

// Column is one column a model reads and how it becomes numbers.
message Column {
  string name = 1;
  // kind is "number", "category", "yesno", "text" or "photo".
  string kind = 2;
  // values are a category column's known values, most common first.
  repeated string values = 3;
  // fill is what an empty cell of a number column reads as.
  double fill = 4;
}

// ModelStatus says whether a model can answer.
enum ModelStatus {
  MODEL_STATUS_UNSPECIFIED = 0;
  MODEL_STATUS_READY = 1;
  MODEL_STATUS_FAILED = 2;
}

// Model is a trained model stored on the server.
message Model {
  string id = 1;
  string name = 2;
  string description = 3;
  // Architecture is the name of the model's Architecture.
  string architecture = 4;
  ModelStatus status = 5;
  // StatusDetail explains a failed status in plain words.
  string status_detail = 6;
  int64 size_bytes = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
  // InputShape and labels are what this model actually reads and answers;
  // they come from the architecture or from the dataset it was taught with.
  repeated int64 input_shape = 10;
  repeated string labels = 11;
  // Features names each input value for a model that reads a row of numbers.
  repeated string features = 12;
  // JobId is the training job that made this model, if any.
  string job_id = 13;
  // accuracy is the share of held-out examples a taught model got right,
  // 0 when unknown.
  double accuracy = 14;
  // worker_id is the worker that answers this model's questions; empty
  // means automatic: this server in standalone mode, else any worker that
  // runs the model's type.
  string worker_id = 15;
  // columns are the table columns the model reads, in order, when it was
  // taught from a table. Ask it with PredictRequest.fields.
  repeated Column columns = 16;
  // language is how a language model answers by default; unset for other
  // models.
  LanguageSettings language = 17;
}

// LanguageSettings are how a language model answers when a chat or an app
// doesn't say.
message LanguageSettings {
  // instructions are what the model reads before every chat, such as who it
  // is and how to talk: the system message.
  string instructions = 1;
  // temperature is how freely it picks words, from 0 to 2.
  float temperature = 2;
  // max_tokens is the longest answer, in tokens.
  int32 max_tokens = 3;
  // api_name is the model name apps send to the OpenAI-compatible API under
  // /v1. Output only: it comes from the model's name.
  string api_name = 4;
}

// Tensor is a dense float32 array.
message Tensor {
  repeated int64 shape = 1;
  repeated float values = 2;
}

// Guess is one possible answer and how likely the model thinks it is.
message Guess {
  string label = 1;
  float probability = 2;
}

message ListArchitecturesRequest {}

message ListArchitecturesResponse {
  repeated Architecture architectures = 1;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated Model models = 1;
}

message GetModelRequest {
  string id = 1;
}

message GetModelResponse {
  Model model = 1;
}

message CreateModelRequest {
  string name = 1;
  string description = 2;
  string architecture = 3;
  // Weights is a Mimir Model (.mim) file: every parameter of the
  // architecture, as mimir's mim.Save writes it, or for the mim
  // architecture the whole model. For the mim and language-model
  // architectures it may also be an ONNX or GGUF file, which the server
  // converts to a Mimir Model file and stores that way; a GGUF language
  // model uploaded as mim becomes a language-model model.
  bytes weights = 4;
}

message CreateModelResponse {
  Model model = 1;
}

message UpdateModelRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  // language, when set, replaces a language model's default settings.
  LanguageSettings language = 4;
}

message UpdateModelResponse {
  Model model = 1;
}

message DeleteModelRequest {
  string id = 1;
}

message DeleteModelResponse {}

message PredictRequest {
  string model_id = 1;
  // Input is one example shaped like the architecture's input_shape.
  // Leave it empty to ask with fields and photo instead.
  Tensor input = 2;
  // TopK is how many guesses to return; 0 means 3.
  int32 top_k = 3;
  // fields are a table row by column name, for a model with columns.
  // Missing columns read as empty.
  map<string, string> fields = 4;
  // photo is a JPG, PNG or GIF, for a model that looks at photos.
  bytes photo = 5;
}

message PredictResponse {
  // Output is the model's raw output for the example.
  Tensor output = 1;
  // Guesses are the most likely labels, most likely first.
  repeated Guess guesses = 2;
  // DurationMicros is how long the model took.
  int64 duration_micros = 3;
  // Probabilities is the softmax of output: one value per label, summing to 1.
  Tensor probabilities = 4;
  // number is set for a model that answers with a number; value is it.
  bool number = 5;
  double value = 6;
}

message GenerateRequest {
  string model_id = 1;
  // prompt is the text to continue.
  string prompt = 2;
  // max_tokens is the most tokens to write; 0 means 128, and it is at most
  // 1024.
  int32 max_tokens = 3;
  // temperature 0 always picks the likeliest next token; higher values,
  // up to 2, write more varied text.
  float temperature = 4;
  // seed makes a generation with a temperature repeatable.
  uint64 seed = 5;
}

// ChatMessage is one turn of a chat.
message ChatMessage {
  // role is "user" or "assistant".
  string role = 1;
  string content = 2;
}

message ChatRequest {
  string model_id = 1;
  // messages are the chat so far, oldest first, ending with the user's.
  repeated ChatMessage messages = 2;
  // instructions, when set, replace the model's default instructions; set
  // it to "" for none.
  optional string instructions = 3;
  // max_tokens is the longest answer; 0 means the model's default.
  int32 max_tokens = 4;
  // temperature, when set, replaces the model's default.
  optional float temperature = 5;
  // seed makes an answer with a temperature repeatable.
  uint64 seed = 6;
}

// ChatResponse is a piece of the answer as it is written. The last one has
// done set and the totals.
message ChatResponse {
  // text is the next piece of the text.
  string text = 1;
  bool done = 2;
  int32 prompt_tokens = 3;
  int32 generated_tokens = 4;
  // finished says the model ended the text itself.
  bool finished = 5;
  int64 duration_micros = 6;
  // context_tokens is the most tokens the model reads and writes at once,
  // prompt and answer together.
  int32 context_tokens = 7;
}

// GenerateStreamRequest is a GenerateRequest whose text comes back piece by
// piece.
message GenerateStreamRequest {
  string model_id = 1;
  string prompt = 2;
  int32 max_tokens = 3;
  float temperature = 4;
  uint64 seed = 5;
}

// GenerateStreamResponse is a piece of the text as it is written. The last
// one has done set and the totals.
message GenerateStreamResponse {
  // text is the next piece of the text.
  string text = 1;
  bool done = 2;
  int32 prompt_tokens = 3;
  int32 generated_tokens = 4;
  // finished says the model ended the text itself.
  bool finished = 5;
  int64 duration_micros = 6;
  // context_tokens is the most tokens the model reads and writes at once,
  // prompt and answer together.
  int32 context_tokens = 7;
}

message GenerateResponse {
  // text is what the model wrote after the prompt.
  string text = 1;
  int32 prompt_tokens = 2;
  int32 generated_tokens = 3;
  // finished says the model ended the text itself, rather than running
  // into max_tokens or the end of its context.
  bool finished = 4;
  // DurationMicros is how long the model took.
  int64 duration_micros = 5;
}
