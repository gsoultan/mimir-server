syntax = "proto3";

package mimir.v1;

import "google/protobuf/timestamp.proto";
import "mimir/v1/settings.proto";

option go_package = "github.com/gsoultan/mimir-server/gen/mimir/v1;mimirv1";

// AuthService signs people in. Browsers get a session cookie; apps use API
// keys in an "Authorization: Bearer" header instead.
service AuthService {
  // GetSetupState says whether the server still needs its configuration
  // or its first owner. Anyone may call it.
  rpc GetSetupState(GetSetupStateRequest) returns (GetSetupStateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CheckDatabase tries a database URL during first-run setup, before the
  // server has one. It needs the setup token, and works only until setup
  // is done.
  rpc CheckDatabase(CheckDatabaseRequest) returns (CheckDatabaseResponse);
  // Setup finishes first-run setup. On a server started with no database
  // it writes the configuration (the database, the log database and the
  // secret key) and then creates the first owner; on one that has its
  // database but no accounts yet it creates the first owner and signs
  // them in. Either way it needs the setup token and works only while the
  // server has no users.
  rpc Setup(SetupRequest) returns (SetupResponse);
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // WhoAmI returns the caller and what they may do.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // VerifySecondFactor finishes a sign-in that SignIn said needs a code.
  rpc VerifySecondFactor(VerifySecondFactorRequest) returns (VerifySecondFactorResponse);
  // StartTwoFactor makes a fresh authenticator secret for the caller. It
  // takes effect only once EnableTwoFactor confirms a code from it.
  rpc StartTwoFactor(StartTwoFactorRequest) returns (StartTwoFactorResponse);
  rpc EnableTwoFactor(EnableTwoFactorRequest) returns (EnableTwoFactorResponse);
  rpc DisableTwoFactor(DisableTwoFactorRequest) returns (DisableTwoFactorResponse);

  // ListSessions shows where the caller is signed in.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeSessions signs out one session, or every session but this one.
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);
}

// UserService manages people and what they can reach.
service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

// ApiKeyService manages the caller's own API keys.
service ApiKeyService {
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateApiKey returns the secret once. The server keeps only a hash.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
}

// AuditService reads the record of who changed what.
service AuditService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Role is a fixed set of permissions. Each role includes the ones before it.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // VIEWER sees models and asks them questions.
  ROLE_VIEWER = 1;
  // EDITOR also adds, renames and deletes models.
  ROLE_EDITOR = 2;
  // ADMIN also manages users and reads the audit log.
  ROLE_ADMIN = 3;
  // OWNER also manages admins and other owners.
  ROLE_OWNER = 4;
}

// Access is a role and the models it applies to.
message Access {
  Role role = 1;
  // AllModels grants the role on every model, including future ones.
  bool all_models = 2;
  // ModelIds lists the models the role applies to when all_models is false.
  repeated string model_ids = 3;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  Access access = 4;
  bool disabled = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp last_sign_in_time = 7;
  // TwoFactor is true once the person confirmed an authenticator app.
  bool two_factor = 8;
  // The team the person belongs to. They see only its models, examples,
  // training runs, webhooks and audit events.
  string team_id = 9;
  string team_name = 10;
}

message GetSetupStateRequest {}

message GetSetupStateResponse {
  bool needs_setup = 1;
  // NeedsConfig is true while the server has no database yet: Setup then
  // takes the database, the log database and the secret key as well.
  bool needs_config = 2;
  // SecretKey says where the key for stored secrets comes from while
  // NeedsConfig is true.
  SecretKeySource secret_key = 3;
  // Retention is what history is kept for unless Setup says otherwise.
  Retention retention = 4;
}

// SecretKeySource is where the key that encrypts stored secrets (webhook
// signing secrets, connection strings, alert credentials and the database
// URLs in the configuration file) comes from.
enum SecretKeySource {
  SECRET_KEY_SOURCE_UNSPECIFIED = 0;
  // None yet: Setup makes one, or saves the one it is given.
  SECRET_KEY_SOURCE_NONE = 1;
  // $MIMIR_SECRET_KEY or -secret-key-file; Setup can't change it.
  SECRET_KEY_SOURCE_ENVIRONMENT = 2;
  // The key file in the data folder, already there.
  SECRET_KEY_SOURCE_FILE = 3;
}

message CheckDatabaseRequest {
  string setup_token = 1;
  // A PostgreSQL URL, such as postgres://mimir:secret@localhost:5432/mimir.
  string database_url = 2;
}

message CheckDatabaseResponse {
  // Version is the server's version, such as "PostgreSQL 16.4".
  string version = 1;
  // HasAccounts is true when the database already has mimir accounts:
  // Setup then keeps them and makes no new owner.
  bool has_accounts = 2;
}

message SetupRequest {
  string email = 1;
  string name = 2;
  string password = 3;
  // The one-time setup token the server printed in its log when it
  // started with no accounts, or $MIMIR_SETUP_TOKEN.
  string setup_token = 4;
  // The rest is taken only while GetSetupState says needs_config.
  // DatabaseUrl is the PostgreSQL database for the server's records.
  string database_url = 5;
  // LogDatabaseUrl is a second PostgreSQL database for the audit log;
  // empty keeps it in the main one.
  string log_database_url = 6;
  // SecretKey is a key to keep, 32 bytes as base64 or hex, such as one
  // backed up with the database; empty makes a new one. Ignored when the
  // key comes from the environment or the key file is already there.
  string secret_key = 7;
  // Retention is how long history is kept; unset keeps the defaults.
  Retention retention = 8;
}

message SetupResponse {
  // User is the new owner, signed in. A Setup that wrote the configuration
  // leaves it unset and signs no one in: the full server starts a moment
  // later, and the owner signs in there.
  User user = 1;
  // SignInNext is true when the owner signs in next, because Setup wrote
  // the configuration or found the database already had accounts.
  bool sign_in_next = 2;
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  // User is set once the sign-in is complete.
  User user = 1;
  // SecondFactorRequired means the password matched and the browser now
  // holds a short-lived cookie that only VerifySecondFactor accepts.
  bool second_factor_required = 2;
}

message SignOutRequest {}

message SignOutResponse {}

message WhoAmIRequest {}

message WhoAmIResponse {
  User user = 1;
  // Permissions are what the caller may do, such as "models.write".
  repeated string permissions = 2;
  // SessionId is this browser's session, so it can be told apart in
  // ListSessions. Empty for API keys.
  string session_id = 3;
  // MustSetUpTwoFactor means an admin requires two-step verification for
  // this account and it isn't on yet; only setting it up is allowed.
  bool must_set_up_two_factor = 4;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message VerifySecondFactorRequest {
  // Code is six digits from the authenticator app, or a recovery code.
  string code = 1;
}

message VerifySecondFactorResponse {
  User user = 1;
  // RecoveryCodesLeft is set when a recovery code was used.
  int32 recovery_codes_left = 2;
  bool used_recovery_code = 3;
}

message StartTwoFactorRequest {
  // Password proves the person at the keyboard, not just the cookie.
  string password = 1;
  // Code is a current code from the authenticator app, or a recovery code.
  // It is needed only when two-step verification is already on, so a
  // stolen cookie and password can't swap in another authenticator.
  string code = 2;
}

message StartTwoFactorResponse {
  // Secret is the base32 key to type by hand; otpauth_url goes in a QR code.
  string secret = 1;
  string otpauth_url = 2;
}

message EnableTwoFactorRequest {
  string code = 1;
}

message EnableTwoFactorResponse {
  // RecoveryCodes are shown once; each works a single time.
  repeated string recovery_codes = 1;
}

message DisableTwoFactorRequest {
  string password = 1;
  // Code is a current code from the authenticator app, or a recovery code,
  // so a stolen cookie and password alone can't turn the second step off.
  string code = 2;
}

message DisableTwoFactorResponse {}

message Session {
  string id = 1;
  // Device is a short description from the browser, like "Chrome on Mac".
  string device = 2;
  string ip = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp last_seen_time = 5;
  bool current = 6;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionsRequest {
  // Id names one session; empty means every session except the current one.
  string id = 1;
}

message RevokeSessionsResponse {
  int32 revoked = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
  // Password is the first password; tell it to the person, who can change
  // it after signing in.
  string password = 3;
  Access access = 4;
  // team_id puts the person in a team; only owners may pick one other than
  // their own. Empty means the caller's team.
  string team_id = 5;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  Access access = 3;
  bool disabled = 4;
  // NewPassword, when set, replaces the user's password and signs them out
  // everywhere. Set on someone else, it also revokes their API keys.
  string new_password = 5;
  // ResetTwoFactor turns off the user's authenticator so they can sign in
  // with their password alone, for when they lost their phone.
  bool reset_two_factor = 6;
  // team_id, when set and different, moves the person to that team (owners
  // only). It signs them out and revokes their API keys.
  string team_id = 7;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

message ApiKey {
  string id = 1;
  string name = 2;
  // Prefix is the start of the secret, to tell keys apart.
  string prefix = 3;
  // Access is what the key may do. It never exceeds its owner's access,
  // checked on every request.
  Access access = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp last_used_time = 6;
}

message ListApiKeysRequest {}

message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
}

message CreateApiKeyRequest {
  string name = 1;
  Access access = 2;
}

message CreateApiKeyResponse {
  ApiKey api_key = 1;
  // Secret is shown only once.
  string secret = 2;
}

message RevokeApiKeyRequest {
  string id = 1;
}

message RevokeApiKeyResponse {}

message AuditEvent {
  string id = 1;
  google.protobuf.Timestamp time = 2;
  // Actor is who did it: a user's email, or "key <name> (<email>)".
  string actor = 3;
  // Action is what happened, such as "model.create".
  string action = 4;
  // Target is what it happened to, such as a model's name.
  string target = 5;
  string detail = 6;
  // team_name is the team it happened in; owners see every team's events.
  string team_name = 7;
}

message ListAuditEventsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}
