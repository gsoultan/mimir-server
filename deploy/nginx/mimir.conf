# nginx in front of the mimir-server console, serving HTTPS. See
# docs/deploy.md. Copy to /etc/nginx/sites-available/mimir (or conf.d/),
# change mimir.example.com and the certificate paths, then `nginx -t` and
# reload. On nginx 1.25.1 or later, `http2 on;` may replace the http2 on
# the listen lines.
#
# Start the console with -trusted-proxies 127.0.0.1,::1
# ($MIMIR_TRUSTED_PROXIES) so it believes the client address and https
# this sends.

upstream mimir {
    server 127.0.0.1:8080;
    keepalive 32;
}

# The same console for gRPC. It must be an upstream of its own: nginx
# can't share kept-alive connections between HTTP/1.1 and HTTP/2.
upstream mimir_grpc {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name mimir.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mimir.example.com;

    ssl_certificate     /etc/letsencrypt/live/mimir.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mimir.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Model and dataset uploads: at least the console's -max-model-mb
    # (256 by default), with room for the form around the file.
    client_max_body_size 300m;

    location / {
        # Workers, and apps that call the API over gRPC, need HTTP/2 all
        # the way to the console. A worker's link stays open and may go
        # quiet from the console's side for long stretches, so the read
        # and send timeouts are long.
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 1d;
        grpc_send_timeout 1d;
        if ($http_content_type ~* "^application/grpc") {
            grpc_pass grpc://mimir_grpc;
        }

        # Everything else: the web app, Connect and JSON calls, the
        # OpenAI-compatible API, /healthz and /metrics.
        proxy_pass http://mimir;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers stream word by word; don't hold them back.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    # /metrics is for your monitoring, not the internet. Allow your
    # scraper's address here, or set -metrics-token.
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://mimir;
    }
}
